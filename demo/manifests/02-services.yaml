apiVersion: v1
kind: Service
metadata:
  name: demo-stable
  namespace: statgate-demo
spec:
  selector:
    app: demo
    version: stable
  ports:
    # Istio admission webhook требует name у портов в namespace с включённым
    # sidecar injection — иначе apply падает с "spec.ports[0].name: Required value".
    # Префикс http- подсказывает Istio про HTTP-протокол (alternative: protocol: HTTP в Istio Service).
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: demo-canary
  namespace: statgate-demo
spec:
  selector:
    app: demo
    version: canary
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
