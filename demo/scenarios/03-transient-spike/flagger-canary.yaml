---
# Flagger Canary для сценария 03-transient-spike.
# Canary полностью здоровый (1% ошибок, как stable), но имеет один 15-сек всплеск
# с ~40% ошибок в середине rollout. Flagger в окне со всплеском увидит error rate
# > 5% и откатит здоровую версию.
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: demo
  namespace: statgate-demo
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo
  ingress:
    name: demo-vs
  service:
    port: 8080
    targetPort: 8080
    gateways:
      - demo-gateway.statgate-demo.svc.cluster.local
    hosts:
      - demo.statgate.local
  analysis:
    stepWeight: 20
    maxWeight: 50
    interval: 60s
    threshold: 2
    maxDuration: 10m
    metrics:
      - name: error-rate
        templateRef:
          name: error-rate
          namespace: flagger-system
        thresholdRange:
          max: 5
        interval: 1m
